name: PRADO ActiveRecord
on: [push, pull_request]
env:
  PHP_VERSION: '8.2'
jobs:
  prado-activerecord:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: ctype, dom, intl, json, mbstring, pdo_sqlite, openssl, pcre, spl, zlib
          tools: php-cs-fixer, phpstan, cs2pr

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Validate code syntax using php-cs-fixer
        run: php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Validate code using phpstan
        run: phpstan analyse --error-format=checkstyle | cs2pr

      - name: Run Unit Tests
        run: composer test

  db-sqlite:
    name: SQLite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP with SQLite extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, dom, intl, json, mbstring, pdo_sqlite, openssl, pcre, spl, zlib

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run SQLite tests
        run: vendor/bin/phpunit --testsuite db-sqlite

  db-mysql:
    name: MySQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP with MySQL extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, dom, intl, json, mbstring, pdo_mysql, openssl, pcre, spl, zlib

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup MySQL schema
        run: bash .github/scripts/setup-mysql.sh

      - name: Run MySQL tests
        run: vendor/bin/phpunit --testsuite db-mysql

  db-pgsql:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP with PostgreSQL extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, dom, intl, json, mbstring, pdo_pgsql, openssl, pcre, spl, zlib

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup PostgreSQL schema
        run: bash .github/scripts/setup-pgsql.sh

      - name: Run PostgreSQL tests
        run: vendor/bin/phpunit --testsuite db-pgsql

  db-firebird:
    name: Firebird
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      firebird:
        image: firebirdsql/firebird:4-jammy
        env:
          FIREBIRD_DATABASE: prado_unitest.fdb
          FIREBIRD_ROOT_PASSWORD: masterkey
        ports:
          - 3050:3050
        options: >-
          --health-cmd "test -f /var/lib/firebird/data/prado_unitest.fdb"
          --health-interval 5s
          --health-timeout 3s
          --health-start-period 30s
          --health-retries 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP with Firebird extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, dom, intl, json, mbstring, pdo_firebird, openssl, pcre, spl, zlib

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Firebird schema
        run: bash .github/scripts/setup-firebird.sh ${{ job.services.firebird.id }}

      - name: Run Firebird tests
        timeout-minutes: 6
        run: vendor/bin/phpunit --testsuite db-firebird

  db-sqlsrv:
    name: Microsoft SQL Server
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Prado_Unitest1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -U sa -P Prado_Unitest1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP with SQL Server extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, dom, intl, json, mbstring, pdo_sqlsrv, sqlsrv, openssl, pcre, spl, zlib

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup SQL Server schema
        run: bash .github/scripts/setup-sqlsrv.sh

      - name: Run SQL Server tests
        run: php vendor/bin/phpunit --testsuite db-sqlsrv

  db-oracle:
    name: Oracle
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23.6-slim-faststart
        env:
          ORACLE_PASSWORD: prado_unitest
          APP_USER: prado_unitest
          APP_USER_PASSWORD: prado_unitest
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Oracle Instant Client
        run: bash .github/scripts/install-oracle-client.sh

      - name: Setup PHP with OCI extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, dom, intl, json, mbstring, pdo_oci, oci8, openssl, pcre, spl, zlib

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Oracle schema
        run: bash .github/scripts/setup-oracle.sh ${{ job.services.oracle.id }}

      - name: Run Oracle tests
        run: php vendor/bin/phpunit --testsuite db-oracle
        env:
          ORACLE_SERVICE_NAME: FREEPDB1

  db-ibm:
    name: IBM DB2
    runs-on: ubuntu-latest
    services:
      db2:
        image: icr.io/db2_community/db2
        env:
          DB2INSTANCE: db2inst1
          DB2INST1_PASSWORD: Prado_Unitest1
          DBNAME: pradount
          LICENSE: accept
        ports:
          - 50000:50000
        options: >-
          --privileged
          --health-cmd "su - db2inst1 -c 'db2 connect to pradount'"
          --health-interval 30s
          --health-timeout 20s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP with IBM DB2 extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, dom, intl, json, mbstring, pdo_ibm, ibm_db2, openssl, pcre, spl, zlib

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup IBM DB2 schema
        run: bash .github/scripts/setup-ibm.sh ${{ job.services.db2.id }}

      - name: Run IBM DB2 tests
        run: php vendor/bin/phpunit --testsuite db-ibm
        env:
          DB2_USER: db2inst1
          DB2_PASSWORD: Prado_Unitest1
          DB2_DATABASE: pradount
